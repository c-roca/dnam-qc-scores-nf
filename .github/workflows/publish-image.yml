name: Publish Docker image

# Builds docker/Dockerfile and publishes it to ghcr.io/<owner>/dnam-qc-scores-nf
# whenever a version tag (v*, e.g. v0.1.0) is pushed. Uses the automatic
# GITHUB_TOKEN (no personal Docker Hub/ghcr.io credentials needed) -- it just
# needs this repo's Settings > Actions > General > Workflow permissions set
# to "Read and write permissions" (or the packages: write scope below, which
# is enough on its own on most repos).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dnam-qc-scores-nf

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
